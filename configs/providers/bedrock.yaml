# Bedrock provider configuration (UNTESTED STUB)
# Uses AWS Bedrock via boto3. Requires AWS credentials in .env.
# This provider is fully written but has NOT been tested against a live
# Bedrock endpoint. It exists to demonstrate the provider abstraction.

# AWS region for Bedrock
region: us-east-1

# Chat/generation model (Claude 3 Haiku — fast and affordable)
model: anthropic.claude-3-haiku-20240307-v1:0

# Embedding model (Titan Embeddings v2 — 1024 dimensions)
embedding_model: amazon.titan-embed-text-v2:0

# Generation parameters
temperature: 0.7
max_output_tokens: 2048

# Request timeout in seconds
timeout: 30
