# Application configuration
# This is the main config file. Secrets (API keys) go in .env, NOT here.

# Active LLM/Embedding provider: gemini | ollama | bedrock
provider: gemini

# Chunking settings for document ingestion
chunking:
    # Number of characters per chunk
    chunk_size: 1000
    # Overlap between consecutive chunks (helps preserve context at boundaries)
    chunk_overlap: 200
    # Chunking strategy: recursive | markdown_aware
    strategy: recursive

# Retrieval settings
retrieval:
    # Number of initial candidates to retrieve
    top_k: 12
    # Number of results after reranking
    final_k: 4
    # Minimum similarity score (0.0-1.0) to include a result
    similarity_threshold: 0.01
    # Retrieval mode: vector | hybrid
    mode: hybrid
    # Reranking strategy: none | llm
    reranker: none
    # Max fraction of model context window for retrieved chunks
    context_budget_ratio: 0.6
    # Maximum query length in characters
    max_query_length: 1000
