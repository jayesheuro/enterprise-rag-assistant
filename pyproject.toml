[project]
name = "enterprise-rag-assistant"
version = "0.1.0"
description = "Enterprise document Q&A platform with built-in evaluation lab"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "Enterprise RAG Team" }]

dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    "pydantic>=2.10.0,<3.0",
    "pydantic-settings>=2.6.0,<3.0",
    "pyyaml>=6.0.2,<7.0",
    "lancedb>=0.15.0,<0.39",
    "google-genai>=1.14.0,<3.0",
    "httpx>=0.28.0,<1.0",
    "tenacity>=9.0.0,<10.0",
    "pypdf>=5.0.0,<6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<10.0",
    "ruff>=0.8.0,<1.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "ragas>=0.4.3",
    "datasets>=5.1.0",
    "numpy>=2.4.6",
    "langchain-community>=0.4.2",
    "langchain>=1.4.3",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests requiring live API access (deselect with '-m \"not integration\"')",
]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
